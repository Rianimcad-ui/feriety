const TC={A:"#1d4ed8",B:"#15803d",C:"#c2410c",D:"#7e22ce",E:"#be185d",MT:"#0f766e"};
function txt(){const m=gm;let o="Richieste ferie e permessi - "+MESI[m]+" "+year+"\n";
TEAMS.forEach(t=>{const L=reqs.filter(r=>r.team===t&&r.date.startsWith(year+"-"+pad(m+1))),by={};
L.forEach(r=>{const n=r.name+" (matr. "+r.mat+")"+(r.oss?" [OSS]":"");(by[n]=by[n]||[]).push(r)});
o+="\nSQUADRA "+t+"\n"+(L.length?Object.entries(by).map(([n,a])=>n+": "+a.sort((x,y)=>x.date<y.date?-1:1).map(r=>fd(r.date)+" ("+r.reason+")").join(", ")).join("\n"):"Nessuna richiesta.")});
return o}
function tbl(){const m=gm,nd=new Date(Date.UTC(year,m+1,0)).getUTCDate(),H=hols(year),dn=["D","L","M","M","G","V","S"],ds=[];
for(let d=1;d<=nd;d++)ds.push({d,k:iso(year,m,d),w:new Date(Date.UTC(year,m,d)).getUTCDay()});
const off=x=>(H[m+"-"+x.d]||x.w===0),hc=x=>off(x)?"h wk":"",wk=x=>off(x)?"wk":"",cd=dl(iso(year,m,1)),
ban=today===cd?`<div class="wn"><b>Oggi si chiude l’inserimento per ${MESI[m]}.</b> La tabella parte in automatico verso il coordinatore.</div>`:today>cd?`<div class="wn"><b>Inserimento per ${MESI[m]} chiuso.</b></div>`:"";
const dh=`<tr><th class="fc">Dipendente</th>${ds.map(x=>`<th class="${hc(x)}">${dn[x.w]}<br>${x.d}</th>`).join("")}</tr>`;
let body="";
TEAMS.forEach(t=>{const E=emps(t),st=`class="tm" style="--tc:${TC[t]}"`;
let rows=`<tr ${st}><td class="fc mu">Turno</td>${ds.map(x=>{const s=shift(t,year,m,x.d);return`<td class="${wk(x)}"><span class="chip s${s}">${s}</span></td>`}).join("")}</tr>`;
rows+=E.length?E.map(e=>`<tr ${st}><td class="fc">${esc(e.name)} <span class="mu">${esc(e.mat)}</span>${e.oss?` <span class="mu"><b>OSS</b></span>`:""}</td>${ds.map(x=>{const r=reqs.find(q=>q.date===x.k&&q.uid===e.uid);return r?(r.uid===user.uid||user.adm||user.coord?`<td class="lv" title="${esc(r.reason)}">${esc(String(r.reason||"").slice(0,2))}</td>`:`<td class="lv"></td>`):`<td class="${wk(x)}"></td>`}).join("")}</tr>`).join("")
:`<tr ${st}><td class="fc mu" colspan="${nd+1}">Nessun dipendente registrato</td></tr>`;
[["Infermieri",false],["OSS",true]].forEach(([lb,o])=>{rows+=`<tr ${st}><td class="fc"><b>${lb}</b> <span class="mu">(max ${MAX})</span></td>${ds.map(x=>{const n=forCat(x.k,t,o).length;return`<td class="${wk(x)}" style="${n>=MAX?"color:var(--hol);font-weight:700":""}">${n||""}</td>`}).join("")}</tr>`});
body+=`<section class="ts" data-t="${t}"><div class="cap" style="--tc:${TC[t]}">Squadra ${t} · ${MESI[m]} ${year} · ${E.length} dipendenti</div><div class="tw"><table class="gr"><thead>${dh}</thead><tbody>${rows}</tbody></table></div></section>`});
return `<div class="yr npr"><button class="ib" data-a="yr" data-v="-1">‹</button><b>${year}</b><button class="ib" data-a="yr" data-v="1">›</button></div>
<div class="npr">${ban}<select class="f1" id="gm">${MESI.map((x,i)=>`<option value="${i}" ${i===m?"selected":""}>${x}</option>`).join("")}</select></div>
${body}
<p class="mu npr">Ogni squadra ha il suo colore. Cella colorata = richiesta; ${user.adm||user.coord?"come amministratore/coordinatore vedi i motivi di tutti.":"il motivo lo vedi solo sulle tue."} Massimo ${MAX} infermieri e ${MAX} OSS per squadra e per giornata. Su smartphone ruota il telefono in orizzontale per leggere meglio.</p>
<div class="npr pbar"><p class="mu">Stampa su foglio A4 in orizzontale, con tutti i giorni del mese:</p>
<select class="f1" id="pr"><option value="all" ${pt==="all"?"selected":""}>Tutte le squadre (più fogli A4, uno per squadra)</option>${TEAMS.map(t=>`<option value="${t}" ${pt===t?"selected":""}>Solo squadra ${t} (1 foglio A4)</option>`).join("")}</select>
<button class="pb" data-a="print">Stampa</button></div>
${user.adm?`<div class="npr"><p class="mu">Invio al coordinatore (solo amministratore): la tabella parte come PDF allegato, identico all’anteprima di stampa, con le squadre scelte nel menu di stampa qui sopra.</p>
<input class="f1" id="co" type="email" placeholder="Email del coordinatore" value="${esc(coord)}">
<button class="pb" data-a="sendpdf">Invia PDF al coordinatore</button>
<button class="lk" data-a="pdf">Scarica PDF</button><button class="lk" data-a="copy">Copia tabella</button></div>`:""}`}
function profile(){return `<div class="ov" data-a="close"><div class="sh" data-a="keep"><div class="row"><h2>${esc(user.name)}</h2><button class="ib" data-a="close">✕</button></div>
<p class="mu">Matricola ${esc(user.mat)}</p><label class="mu">Squadra</label><select class="f1" id="pt">${TEAMS.map(t=>`<option ${t===user.team?"selected":""}>${t}</option>`).join("")}</select>
<label class="ck"><input type="checkbox" id="po" ${user.oss?"checked":""}> OSS</label>
${user.adm?`<hr><h2>Amministratore: reset password</h2><p class="mu">Imposta una password generica: l’utente dovrà cambiarla al primo accesso.</p>
<input class="f1" id="rm" placeholder="Matricola dell’utente"><input class="f1" id="rp" value="${genpw()}"><button class="pb" data-a="reset">Reimposta password</button><div id="rr"></div><hr>`:""}
<button class="pb" data-a="save">Salva</button><button class="lk" data-a="out">Esci</button></div></div>`}
async function load(){if(!user)return;
const a=await sb.from("profiles").select("*");if(a.data)profs=a.data;
let rs=[],f=0;for(;;){const{data,error}=await sb.from("requests").select("*").gte("date",year+"-01-01").lte("date",year+"-12-31").range(f,f+999);
if(error)break;rs=rs.concat(data);if(data.length<1000)break;f+=1000}
const m=new Map(profs.map(p=>[p.id,p]));
reqs=rs.map(r=>{const p=m.get(r.user_id)||{};return{...r,uid:r.user_id,name:p.name||"?",mat:p.matricola||"",oss:!!p.oss}});render()}
async function start(){const{data:{session}}=await sb.auth.getSession();if(!session){user=null;render();return}
const{data}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
if(!data){user=null;render();return}
user={uid:data.id,name:data.name,team:data.team,mat:data.matricola,adm:!!data.is_admin,coord:!!data.is_coord,oss:!!data.oss,must:!!data.must_change};await load();
if(year===T.getFullYear()){const e=document.getElementById("m"+T.getMonth());if(e&&tab==="cal")e.scrollIntoView()}}
async function auth(){const mat=$("#ae").value.trim().toLowerCase(),p=$("#ap").value,er=$("#err");let r;
if(!mat||!p){er.textContent="Compila tutti i campi.";return}
if(mode==="reg"){const n=$("#an").value.trim();
if(!n||!/^[a-z0-9]{3,}$/.test(mat)){er.textContent="Inserisci nome e matricola (almeno 3 caratteri, senza spazi).";return}
if(p.length<6){er.textContent="Password: almeno 6 caratteri.";return}
r=await sb.auth.signUp({email:mat+DOM,password:p,options:{data:{name:n,matricola:mat,team:$("#at").value,oss:$("#ao").checked}}})}
else r=await sb.auth.signInWithPassword({email:mat+DOM,password:p});
if(r.error){er.textContent=/registered|already/i.test(r.error.message)?"Matricola già registrata.":mode==="reg"?r.error.message:"Credenziali non corrette.";return}
if(!r.data.session){er.textContent="Accesso non attivo: serve disattivare «Confirm email» in Supabase (vedi guida).";return}
if(mode==="reg"&&$("#ao").checked){try{await sb.from("profiles").update({oss:true}).eq("id",r.data.user.id)}catch(e){}}
await start()}
async function addReq(k,reason){
if(today>dl(k)){toast("Termine scaduto: contatta il coordinatore");return}
const{error}=await sb.from("requests").insert({date:k,reason});
if(error){const m=error.message||"";
toast(m.includes("LIMITE_3")?"Giornata al completo: comunica la richiesta al coordinatore":m.includes("TERMINE")?"Termine scaduto: contatta il coordinatore":error.code==="23505"?"Hai già una richiesta per questo giorno":"Errore: riprova");
await load();return}
sel=null;toast("Richiesta inviata");await load()}
// ===== PDF identico all'anteprima di stampa (A4 orizzontale, un foglio per squadra) =====
const PDFLIBS=["https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js","https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"];
const loadScript=u=>new Promise((ok,ko)=>{const e=document.createElement("script");e.src=u;e.onload=ok;e.onerror=ko;document.head.appendChild(e)});
async function pdfLibs(){if(!(window.jspdf&&window.jspdf.jsPDF)){await loadScript(PDFLIBS[0]);await loadScript(PDFLIBS[1])}}
async function buildPdf(sel){await pdfLibs();const{jsPDF}=window.jspdf,m=gm,nd=new Date(Date.UTC(year,m+1,0)).getUTCDate(),H=hols(year),dn=["D","L","M","M","G","V","S"];
const doc=new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),tint=(c,k)=>c.map(v=>Math.round(255-(255-v)*k));
const SC={M:["#fde7a8","#6b4a00"],P:["#ffd2b0","#7a3300"],N:["#c9d0f7","#1f2a7a"],S:["#ecd0f4","#5a1d70"],R:["#cfeedb","#14532d"]};
const WK=[247,234,233],RED=[180,35,24],WHITE=[255,255,255],BLACK=[0,0,0],W=281,FC=50;
const days=[];for(let d=1;d<=nd;d++){const w=new Date(Date.UTC(year,m,d)).getUTCDay();days.push({d,k:iso(year,m,d),w,off:!!(H[m+"-"+d]||w===0)})}
const list=sel==="all"?TEAMS:[sel];let first=true;
list.forEach(t=>{if(!first)doc.addPage();first=false;
const E=emps(t),tc=rgb(TC[t]),mese=MESI[m][0].toUpperCase()+MESI[m].slice(1);
doc.setFillColor(...tc);doc.rect(8,8,W,9,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(14);
doc.text("Squadra "+t+" · "+mese+" "+year+" · "+E.length+" dipendenti",12,14.3);
const head=[[{content:"Dipendente",styles:{halign:"left"}},...days.map(x=>({content:dn[x.w]+"\n"+x.d,styles:{textColor:x.off?RED:BLACK,fillColor:x.off?WK:WHITE}}))]];
const lt=tint(tc,.12),body=[];
body.push([{content:"Turno",styles:{halign:"left",fillColor:lt,textColor:[80,80,80]}},...days.map(x=>{const sh=shift(t,year,m,x.d);return{content:sh,styles:{fillColor:rgb(SC[sh][0]),textColor:rgb(SC[sh][1]),fontStyle:"bold"}}})]);
if(E.length){E.forEach(e=>body.push([{content:e.name+"  "+e.mat+(e.oss?"  OSS":""),styles:{halign:"left",fillColor:lt}},...days.map(x=>{const r=reqs.find(q=>q.date===x.k&&q.uid===e.uid);
return r?{content:String(r.reason||"?").slice(0,2),styles:{fillColor:tc,textColor:WHITE,fontStyle:"bold"}}:{content:"",styles:{fillColor:x.off?WK:WHITE}}})]))}
else body.push([{content:"Nessun dipendente registrato",colSpan:nd+1,styles:{halign:"left",fillColor:lt,textColor:[80,80,80]}}]);
[["Infermieri",false],["OSS",true]].forEach(([lb,o])=>body.push([{content:lb+" (max "+MAX+")",styles:{halign:"left",fontStyle:"bold",fillColor:lt}},...days.map(x=>{const n=reqs.filter(r=>r.date===x.k&&r.team===t&&!!r.oss===o).length;
return{content:n?String(n):"",styles:{fillColor:x.off?WK:WHITE,textColor:n>=MAX?RED:BLACK,fontStyle:n>=MAX?"bold":"normal"}}})]));
const cs={0:{cellWidth:FC,halign:"left",cellPadding:{top:1.6,bottom:1.6,left:2,right:1}}};for(let i=1;i<=nd;i++)cs[i]={cellWidth:(W-FC)/nd};
doc.autoTable({head,body,startY:19,margin:{left:8,right:8,top:8,bottom:8},tableWidth:W,theme:"grid",columnStyles:cs,
styles:{font:"helvetica",fontSize:8,cellPadding:{top:1.6,bottom:1.6,left:0,right:0},halign:"center",valign:"middle",lineColor:[153,153,153],lineWidth:.2,textColor:BLACK,overflow:"ellipsize"},
headStyles:{fillColor:WHITE,textColor:BLACK,fontStyle:"bold",fontSize:7.5}})});
return doc}
const pdfName=()=>"Turni_ferie_"+MESI[gm]+"_"+year+(pt==="all"?"":"_squadra_"+pt)+".pdf";
// Invio (solo amministratore): 1) email automatica con PDF allegato (funzione Supabase "invia-turni"), 2) condivisione con allegato (smartphone), 3) scarica il PDF e apre l'email
async function sendPdf(){if(!user||!user.adm){toast("Non autorizzato");return}
const to=(($("#co")||{}).value||coord).trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){toast("Inserisci l'email del coordinatore");return}
toast("Preparo il PDF…");let doc;try{doc=await buildPdf(pt)}catch(e){toast("Errore nella creazione del PDF");return}
const fn=pdfName(),subject="Richieste ferie "+MESI[gm]+" "+year,text="Buongiorno, in allegato la tabella delle richieste di ferie e permessi di "+MESI[gm]+" "+year+" (PDF).\nCordiali saluti";
try{const r=await sb.functions.invoke("invia-turni",{body:{to,subject,text,filename:fn,pdf:doc.output("datauristring").split(",")[1]}});
if(!r.error&&r.data&&r.data.ok){toast("Email con PDF inviata al coordinatore");return}}catch(e){}
const file=new File([doc.output("blob")],fn,{type:"application/pdf"});
if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:subject,text});return}catch(e){if(e&&e.name==="AbortError")return}}
doc.save(fn);toast("PDF scaricato: allegalo all'email");
window.location.href="mailto:"+encodeURIComponent(to)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(text+"\n\n(Allega il file "+fn+" appena scaricato)")}
async function dlPdf(){if(!user||!user.adm)return;toast("Preparo il PDF…");try{(await buildPdf(pt)).save(pdfName())}catch(e){toast("Errore nella creazione del PDF")}}
// Stampa: tutte le squadre (un foglio A4 orizzontale per squadra) oppure una sola squadra (1 foglio)
function doPrint(){const ps=$("#ps");
ps.textContent=pt==="all"?"":"@media print{.ts:not([data-t=\""+pt+"\"]){display:none!important}}";
window.print()}
window.addEventListener("afterprint",()=>{const ps=$("#ps");if(ps)ps.textContent=""});
document.addEventListener("click",async ev=>{
const el=ev.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,v=el.dataset.v;
if(a==="keep")return;
if(a==="close"){if(ev.target.closest(".ib")||ev.target.classList.contains("ov")){sel=null;prof=false;render()}return}
if(a==="mode"){mode=mode==="reg"?"login":"reg";render()}
else if(a==="auth")auth();
else if(a==="tab"){tab=v;render();scrollTo(0,0)}
else if(a==="yr"){year+=+v;await load()}
else if(a==="day"){sel=v;render()}
else if(a==="add"){let r=$("#rs").value;if(r==="Altro motivo"){const x=$("#rx").value.trim();if(x.length<3){toast("Specifica il motivo (causale)");return}r="Altro: "+x}addReq(v,r)}
else if(a==="del"){await sb.from("requests").delete().eq("id",v);await load()}
else if(a==="prof"){prof=true;render()}
else if(a==="save"){const t=$("#pt").value,os=$("#po").checked;const{error}=await sb.from("profiles").update({team:t,oss:os}).eq("id",user.uid);
if(error)toast("Errore: riprova");else{user.team=t;user.oss=os;gt=null;prof=false;await load()}}
else if(a==="out"){await sb.auth.signOut();user=null;prof=false;sel=null;reqs=[];render()}
else if(a==="print")doPrint();else if(a==="sendpdf")await sendPdf();else if(a==="pdf")await dlPdf();
else if(a==="forgot"){mode="forgot";render()}
else if(a==="back"){mode="login";render()}
else if(a==="newpw"){const p1=$("#n1").value,p2=$("#n2").value,er=$("#err");
if(p1.length<6){er.textContent="Password: almeno 6 caratteri.";return}
if(p1!==p2){er.textContent="Le due password non coincidono.";return}
const{error}=await sb.auth.updateUser({password:p1});
if(error){er.textContent=/same|different/i.test(error.message)?"Scegli una password diversa da quella generica.":"Errore: riprova.";return}
await sb.from("profiles").update({must_change:false}).eq("id",user.uid);user.must=false;toast("Password aggiornata");await load()}
else if(a==="reset"){const mt=$("#rm").value.trim().toLowerCase(),pw=$("#rp").value;
if(!mt||pw.length<6){toast("Inserisci matricola e password (min. 6 caratteri)");return}
const{error}=await sb.rpc("admin_reset_password",{mat:mt,pwd:pw});
if(error){toast(/NON_ADMIN/.test(error.message)?"Non autorizzato":"Errore: riprova");return}
$("#rr").innerHTML=`<p class="mu">Password reimpostata per la matricola ${esc(mt)}.</p><a class="pb" style="display:block;text-align:center;text-decoration:none" href="mailto:?subject=${encodeURIComponent("Reset password Ferie reparto")}&body=${encodeURIComponent("Matricola: "+mt+"\nPassword generica: "+pw+"\nAl primo accesso dovrai sostituirla con una tua.")}">Apri email con la password generica</a>`}
else if(a==="copy"){try{await navigator.clipboard.writeText(txt());toast("Tabella copiata")}catch(e){toast("Copia non disponibile")}}
});
document.addEventListener("change",ev=>{const i=ev.target.id;if(i==="gt"){gt=ev.target.value;render()}if(i==="gm"){gm=+ev.target.value;render()}if(i==="pr"){pt=ev.target.value}if(i==="rs"){const x=$("#rx");if(x)x.style.display=ev.target.value==="Altro motivo"?"block":"none"}});
document.addEventListener("input",ev=>{if(ev.target.id==="fm"){fmat=ev.target.value.trim();const l=$("#fl");if(l)l.href=fhref()}if(ev.target.id==="co"){coord=ev.target.value;try{localStorage.setItem("coord",coord)}catch(e){}
const m=$("#ml");if(m)m.href="mailto:"+encodeURIComponent(coord)+"?subject="+encodeURIComponent("Richieste ferie "+year)+"&body="+encodeURIComponent(txt())}});
(async()=>{
if(SUPABASE_URL.startsWith("INCOLLA")){$("#app").innerHTML=`<div class="auth"><h1>Configurazione mancante</h1><p>Inserisci URL e chiave di Supabase in cima al file index.html (vedi GUIDA.md).</p></div>`;return}
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);render();await start();
setInterval(()=>{if(user&&!user.must&&!sel&&!prof&&document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="SELECT")load()},30000)
})();
